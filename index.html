<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guepar vs RobÔ - Painel de Controle</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfeff',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full text-slate-100 bg-slate-950 font-sans antialiased selection:bg-cyan-500 selection:text-white">

  <!-- NOTIFICAÇÃO TOAST -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden bg-slate-800 text-white px-5 py-3 rounded-xl border border-cyan-500/30 shadow-2xl flex items-center space-x-2 backdrop-blur-md">
    <i class="ph ph-info text-cyan-400 text-lg"></i>
    <span id="toast-msg" class="text-sm font-semibold"></span>
  </div>

  <!-- TELA DE LOGIN -->
  <div id="tela-login" class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 p-8 rounded-3xl backdrop-blur-xl shadow-2xl space-y-6">
      
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center p-3 bg-cyan-500/10 rounded-2xl border border-cyan-500/20 mb-2">
          <i class="ph ph-robot text-4xl text-cyan-400"></i>
        </div>
        <h1 class="text-2xl font-black tracking-tight text-white">Guepar <span class="text-cyan-400">vs</span> RobÔ</h1>
        <p class="text-xs text-gray-400">Acesse sua conta para gerenciar estoque e manutenções</p>
      </div>

      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-xs uppercase font-bold text-gray-400 mb-1 tracking-wider">E-mail</label>
          <input type="email" id="login-email" value="fellipe.f@grupodime.com.br" required class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition text-sm">
        </div>

        <div>
          <label class="block text-xs uppercase font-bold text-gray-400 mb-1 tracking-wider">Senha</label>
          <input type="password" id="login-senha" value="123456" required class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition text-sm">
        </div>

        <button type="submit" id="btn-login" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-cyan-950/50 flex items-center justify-center space-x-2 text-sm">
          <span>Entrar no Sistema</span>
          <i class="ph ph-arrow-right text-lg"></i>
        </button>
      </form>

    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL (SISTEMA) -->
  <div id="tela-app" class="hidden min-h-screen flex flex-col md:flex-row bg-slate-950">
    
    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="w-full md:w-64 bg-slate-900/80 border-r border-slate-800/80 p-5 flex flex-col justify-between shrink-0 backdrop-blur-md">
      <div class="space-y-6">
        
        <!-- LOGO -->
        <div class="flex items-center space-x-3 px-2">
          <div class="p-2 bg-cyan-500/10 text-cyan-400 rounded-xl border border-cyan-500/20">
            <i class="ph ph-robot text-2xl"></i>
          </div>
          <div>
            <h2 class="font-black text-white text-lg leading-none">Guepar <span class="text-cyan-400">vs</span> RobÔ</h2>
            <span class="text-[10px] text-gray-400 font-semibold tracking-wider uppercase">Painel Operacional</span>
          </div>
        </div>

        <!-- MENU DE NAVEGAÇÃO -->
        <nav class="space-y-1">
          <a href="#dashboard" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-sm transition text-cyan-400 bg-cyan-500/10 border border-cyan-500/20" data-aba="dashboard">
            <i class="ph ph-squares-four text-lg"></i>
            <span>Dashboard</span>
          </a>

          <a href="#manutencoes" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm transition text-gray-400 hover:text-white hover:bg-slate-800/50" data-aba="manutencoes">
            <i class="ph ph-wrench text-lg"></i>
            <span>Manutenções</span>
          </a>

          <a href="#guepar" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm transition text-gray-400 hover:text-white hover:bg-slate-800/50" data-aba="guepar">
            <i class="ph ph-package text-lg"></i>
            <span>Guepar Uso</span>
          </a>

          <a href="#pecas" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm transition text-gray-400 hover:text-white hover:bg-slate-800/50" data-aba="pecas">
            <i class="ph ph-cpu text-lg"></i>
            <span>Peças do Robô</span>
          </a>

          <a href="#fornecedores" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm transition text-gray-400 hover:text-white hover:bg-slate-800/50" data-aba="fornecedores">
            <i class="ph ph-users-three text-lg"></i>
            <span>Fornecedores</span>
          </a>
        </nav>

      </div>

      <!-- RODAPÉ DA SIDEBAR -->
      <div class="pt-6 border-t border-slate-800/80 space-y-4">
        
        <!-- STATUS CONEXÃO -->
        <div class="flex items-center space-x-2 px-2">
          <div id="ponto-conexao" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
          <span id="texto-conexao" class="text-xs text-gray-400 font-medium">Sincronizado</span>
        </div>

        <!-- USUÁRIO / SAIR -->
        <div class="bg-slate-800/40 p-3 rounded-xl border border-slate-800 flex items-center justify-between">
          <div class="truncate mr-2">
            <p id="usuario-email" class="text-xs font-bold text-white truncate"></p>
          </div>
          <button id="btn-sair" title="Sair do sistema" class="text-gray-400 hover:text-red-400 p-1.5 transition rounded-lg hover:bg-slate-800">
            <i class="ph ph-sign-out text-lg"></i>
          </button>
        </div>

      </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL (MUDANÇA DE ABAS) -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto space-y-6">
      
      <!-- ABA 1: DASHBOARD -->
      <div id="aba-dashboard" class="aba-conteudo space-y-6"></div>

      <!-- ABA 2: MANUTENÇÕES -->
      <div id="aba-manutencoes" class="aba-conteudo hidden space-y-6"></div>

      <!-- ABA 3: GUEPAR USO -->
      <div id="aba-guepar" class="aba-conteudo hidden space-y-6"></div>

      <!-- ABA 4: PEÇAS DO ROBÔ -->
      <div id="aba-pecas" class="aba-conteudo hidden space-y-6"></div>

      <!-- ABA 5: FORNECEDORES -->
      <div id="aba-fornecedores" class="aba-conteudo hidden space-y-6"></div>

    </main>

  </div>

  <!-- CONTAINER PARA MODAIS DE CRUD DINÂMICOS -->
  <div id="container-modais"></div>

  <!-- MODAL GLOBAL DE CONFIRMAÇÃO -->
  <div id="modalConfirma" class="fixed inset-0 bg-slate-950/80 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl text-center">
      <div class="inline-flex items-center justify-center p-3 bg-red-500/10 text-red-400 rounded-full mb-1">
        <i class="ph ph-warning text-3xl"></i>
      </div>
      <h3 class="text-base font-bold text-white">Confirmar Ação</h3>
      <p id="confirma-texto" class="text-xs text-gray-400"></p>
      <div class="flex justify-center space-x-3 pt-2">
        <button onclick="fecharModal('modalConfirma')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-gray-300 rounded-xl text-xs font-semibold transition">Cancelar</button>
        <button id="confirma-ok" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-semibold transition">Confirmar Exclusão</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT INICIALIZADOR MÓDULO JS -->
  <script type="module" src="./js/main.js"></script>

</body>
</html>
