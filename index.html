<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guepar vs RobÔ — Painel de Estoque e Manutenção</title>
  
  <!-- Ícone da Aba do Navegador -->
  <link rel="icon" type="image/jpeg" href="guepar.jpeg">

  <!-- Tailwind CSS & Phosphor Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Supabase & Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* Estilo para impressão do relatório */
    @media print {
      body * { visibility: hidden; }
      #area-impressao, #area-impressao * { visibility: visible; }
      #area-impressao { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-no-repeat bg-cover bg-center bg-fixed min-h-screen text-gray-100 relative" style="background-image: url('azuk.jpg');">

  <!-- Camada escura para garantir leitura dos cards sobre o fundo -->
  <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm -z-10"></div>

  <!-- TELA DE LOGIN -->
  <div id="tela-login" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900/90 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl backdrop-blur-md">
      <div class="flex items-center justify-center mb-6">
        <img src="guepar.jpeg" alt="Guepar Logo" class="h-12 w-12 rounded-full mr-3 border-2 border-cyan-500 object-cover" onerror="this.remove()">
        <h1 class="text-2xl font-black tracking-tight text-white">Guepar <span class="text-cyan-400 font-normal">vs</span> RobÔ</h1>
      </div>
      <p class="text-gray-400 text-sm text-center mb-6">Acesse sua conta para gerenciar estoque e manutenções</p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">E-mail</label>
          <input type="email" id="login-email" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-500 transition" placeholder="seu@email.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Senha</label>
          <input type="password" id="login-senha" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-500 transition" placeholder="••••••••">
        </div>
        
        <p id="login-erro" class="text-red-400 text-xs font-semibold text-center min-h-[1rem]"></p>
        
        <button id="btn-entrar" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-cyan-900/40 transition active:scale-[0.98]">
          Entrar no Sistema
        </button>
      </div>
    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL -->
  <div id="app" class="hidden flex min-h-screen">
    
    <!-- BARRA LATERAL / NAVEGAÇÃO -->
    <aside class="w-64 bg-slate-900/90 border-r border-slate-800/80 flex flex-col justify-between shrink-0 backdrop-blur-md">
      <div>
        <!-- LOGO HEADER -->
        <div class="p-6 flex items-center border-b border-slate-800/80">
          <img src="guepar.jpeg" alt="Logo" class="h-10 w-10 rounded-full mr-3 border border-cyan-500/50 object-cover" onerror="this.remove()">
          <span class="text-lg font-black tracking-tight text-white">Guepar <span class="text-cyan-400 font-normal">vs</span> RobÔ</span>
        </div>

        <!-- MENU DE NAVEGAÇÃO -->
        <nav class="p-4 space-y-1">
          <button data-aba="dashboard" class="btn-aba w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-gray-400 hover:text-white hover:bg-slate-800/50">
            <i class="ph ph-squares-four text-lg"></i>
            <span>Dashboard</span>
          </button>
          <button data-aba="manutencoes" class="btn-aba w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-gray-400 hover:text-white hover:bg-slate-800/50">
            <i class="ph ph-calendar-check text-lg"></i>
            <span>Manutenções</span>
          </button>
          <button data-aba="guepar" class="btn-aba w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-gray-400 hover:text-white hover:bg-slate-800/50">
            <i class="ph ph-wrench text-lg"></i>
            <span>Guepar Uso</span>
          </button>
          <button data-aba="pecas" class="btn-aba w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-gray-400 hover:text-white hover:bg-slate-800/50">
            <i class="ph ph-cpu text-lg"></i>
            <span>Peças do Robô</span>
          </button>
          <button data-aba="fornecedores" class="btn-aba w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-gray-400 hover:text-white hover:bg-slate-800/50">
            <i class="ph ph-users-three text-lg"></i>
            <span>Fornecedores</span>
          </button>
          <button data-aba="assistente" class="btn-aba w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-gray-400 hover:text-white hover:bg-slate-800/50">
            <i class="ph ph-sparkle text-lg"></i>
            <span>Assistente</span>
          </button>
        </nav>
      </div>

      <!-- FOOTER DA BARRA LATERAL -->
      <div class="p-4 border-t border-slate-800/80 space-y-3">
        <div class="flex items-center space-x-2 px-2 text-xs text-gray-400">
          <div id="ponto-conexao" class="w-2 h-2 rounded-full bg-gray-500 shrink-0"></div>
          <span id="texto-conexao" class="truncate">Iniciando...</span>
        </div>
        <div id="usuario-atual" class="px-2 text-xs font-mono text-cyan-400/80 truncate"></div>
        <button id="btn-sair" class="w-full flex items-center space-x-2 px-4 py-2 text-xs font-semibold text-red-400 hover:bg-red-500/10 rounded-lg transition">
          <i class="ph ph-sign-out text-sm"></i>
          <span>Sair do sistema</span>
        </button>
      </div>
    </aside>

    <!-- ÁREA DE CONTEÚDO PRINCIPAL -->
    <main class="flex-1 overflow-y-auto p-8">
      
      <!-- ABAS DINÂMICAS -->
      <div id="aba-dashboard" class="conteudo-aba space-y-6"></div>
      <div id="aba-manutencoes" class="conteudo-aba hidden space-y-6"></div>
      <div id="aba-guepar" class="conteudo-aba hidden space-y-6"></div>
      <div id="aba-pecas" class="conteudo-aba hidden space-y-6"></div>
      <div id="aba-fornecedores" class="conteudo-aba hidden space-y-6"></div>
      <div id="aba-assistente" class="conteudo-aba hidden space-y-6"></div>

    </main>
  </div>

  <!-- CONTAINER DE REPOSITÓRIO DE IMPRESSÃO (RELATÓRIOS) -->
  <div id="area-impressao" class="hidden"></div>

  <!-- NOTIFICAÇÕES TOAST -->
  <div id="toast" class="hidden fixed bottom-5 right-5 bg-cyan-600 text-white font-bold px-5 py-3 rounded-xl shadow-2xl transition-all z-50 border border-cyan-400/30"></div>

  <!-- MODAL DE CONFIRMAÇÃO -->
  <div id="modalConfirma" class="hidden fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-white">Confirmar Ação</h3>
      <p id="confirma-texto" class="text-sm text-gray-300"></p>
      <div class="flex justify-end space-x-3 pt-2">
        <button onclick="fecharModal('modalConfirma')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-gray-300 rounded-lg text-sm font-semibold transition">Cancelar</button>
        <button id="confirma-ok" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg text-sm font-semibold transition">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- MODAIS CRUD (DINÂMICOS/REUTILIZÁVEIS) -->
  <div id="container-modais"></div>

  <!-- BOOTSTRAP DA APLICAÇÃO (ES MODULES) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
